name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: Windows (x64)
            rust_targets: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            name: macOS (Universal)
            rust_targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            name: Linux (x64)
            rust_targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    name: Build · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source
        run: |
          npm ci
          npm test
          node --check frontend/instagram-tools.js
          node --check frontend/direct-messages.js
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Put Homebrew sbin on PATH
        if: startsWith(matrix.platform, 'macos-')
        run: echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
      - name: Build release packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'IG-Now ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Desktop message notifications, a single outer DM scroll surface, and restored automated-message link buttons. See RELEASE_NOTES.md for usage and verification details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Verify assets, upload checksum manifests, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          cd release-assets
          rm -f checksums.txt SHA256SUMS.txt
          # Publication must fail if any supported platform package is missing.
          for suffix in '*_x64-setup.exe' '*_x64_en-US.msi' '*_universal.dmg' '*_amd64.AppImage' '*_amd64.deb' '*.rpm' '*.app.tar.gz'; do
            compgen -G "$suffix" > /dev/null || { echo "Missing package: $suffix"; exit 1; }
          done
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > ../checksums.txt
          cd ..
          cp checksums.txt SHA256SUMS.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" checksums.txt SHA256SUMS.txt --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md --draft=false --latest
