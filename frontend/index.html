<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG-Now</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="about-modal" id="ignow-about-modal" hidden>
    <section class="about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <button class="about-close" id="about-close" type="button" aria-label="Close About IG-Now">&times;</button>
      <img src="logo.png" alt="IG-Now icon" class="about-logo">
      <p class="about-kicker">INSTAGRAM DESKTOP VIEW</p>
      <h1 id="about-title">About IG-Now</h1>
      <p class="about-description">A focused Instagram desktop view, powered by Tauri and WebView2.</p>
      <p class="about-credit">Crafted with care by <a id="about-author" href="https://github.com/benedictusrey">@benedictusrey</a></p>
      <button class="about-action" id="about-action" type="button">Close</button>
    </section>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
